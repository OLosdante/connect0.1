<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore current job opportunities on Connect.">
    <link rel="stylesheet" href="styles.css">
    <title>Jobs | Connect</title>
</head>
<body>
    <nav class="nav" aria-label="Main navigation">
        <div class="title">Connect</div>
        <a class="navbtn" href="index.html">Home</a>
        <a class="navbtn" href="jobs.html" aria-current="page">Jobs</a>
        <a class="navbtn" href="aboutus.html">About Us</a>
        <a class="navbtn" href="blogs.html">Blogs</a>
        <a class="navbtn" href="mailto:olosdante@gnail.com">Contact us</a>
        <button id="mobilenav" class="mobileNav" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
    </nav>
    <div id="mobileN" class="mobileN" aria-label="Mobile navigation">
        <a class="navbtnM" href="index.html">Home</a>
        <a class="navbtnM" href="jobs.html" aria-current="page">Jobs</a>
        <a class="navbtnM" href="aboutus.html">About Us</a>
        <a class="navbtnM" href="blogs.html">Blogs</a>
        <a class="navbtnM" href="mailto:olosdante@gnail.com">Contact us</a>
    </div>

    <main class="jobs-page">
        <header class="jobs-hero">
            <p class="jobs-eyebrow">FIND YOUR NEXT OPPORTUNITY</p>
            <h1>Explore jobs</h1>
            <p>Browse current openings and find a role that fits your life.</p>
        </header>

        <section class="job-tools" aria-label="Search and filter jobs">
            <label>
                <span class="sr-only">Search jobs</span>
                <input id="jobSearch" type="search" placeholder="Search title, company, or location">
            </label>
            <label>
                <span class="sr-only">Filter by work type</span>
                <select id="jobType">
                    <option value="">All work types</option>
                    <option value="Remote">Remote</option>
                    <option value="Hybrid">Hybrid</option>
                    <option value="Onsite">Onsite</option>
                    <option value="Internship">Internship</option>
                    <option value="Contract">Contract</option>
                </select>
            </label>
        </section>

        <p id="jobsStatus" class="jobs-status" role="status">Loading jobs…</p>
        <section id="jobListings" class="job-listings" aria-label="Available jobs"></section>
    </main>

    <footer class="footer">
        <p><a href="mailto:olosdante@gnail.com">Contact Connect</a></p>
        <p class="copyright">Copyright © 2026 Connect. All rights reserved.</p>
    </footer>

    <script src="jobs.js"></script>
</body>
</html>
